name = "alifly-telegram"
main = "src/index.ts"
compatibility_date = "2026-11-23"

# Before deploying:
# 1. Create a D1 database and replace the database_name/database_id below.
# 2. Run: npx wrangler d1 execute alifly-telegram --file=./schema.sql
# 3. Set secrets with: npx wrangler secret put TELEGRAM_BOT_TOKEN
#    npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
# 4. Set APP_URL to the full HTTPS URL hosting the Telegram Mini App.

[vars]
APP_URL = "https://YOUR-MINI-APP-DOMAIN"

[[d1_databases]]
binding = "DB"
database_name = "alifly-telegram"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
