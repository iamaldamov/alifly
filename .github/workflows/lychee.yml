name: Check links

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lychee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check Markdown links
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,206,403,429 --max-retries 2 --timeout 20 "**/*.md"
          fail: true
