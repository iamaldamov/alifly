name: Build ALIFLY

on:
  push:
    branches:
      - main
      - "setup/**"
      - "feature/**"
      - "design/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg for SILMA audio preprocessing
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install SILMA TTS v1 with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "silma-tts==1.0.5"
      - name: Download pinned commercial reference voice
        run: |
          curl --fail --location --retry 3 \
            https://huggingface.co/spaces/silma-ai/silma-tts-v1-demo/resolve/ef964ebeb35684e7a02a44b9aa8f26c42c1a3bb2/silma-ref-voice-commercial.wav \
            --output /tmp/silma-ref-voice-commercial.wav
          echo "1c2e349fe42bf562932c00a51001e94970d3c210128e6a1ade89bb18148bd6ec  /tmp/silma-ref-voice-commercial.wav" | sha256sum --check
      - name: Generate and validate 28 Arabic letter clips
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: python scripts/generate-silma-arabic-audio.py
      - name: Run unit tests
        run: npm test
      - name: Build project
        run: npm run build
      - name: Verify GitHub Pages routes, SEO files and audio
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/lessons/index.html
          test -f dist/lessons/alif/index.html
          grep -q "Уроки арабского языка" dist/lessons/index.html
          grep -q "Арабская буква Алиф" dist/lessons/alif/index.html
          grep -q "assets/" dist/lessons/alif/index.html
          test "$(find dist/audio/letters -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 28
      - name: Upload generated letter audio for manual review
        uses: actions/upload-artifact@v4
        with:
          name: alifly-silma-arabic-letter-audio
          path: public/audio/letters/*.wav
          if-no-files-found: error
          retention-days: 7
