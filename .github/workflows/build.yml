name: Build ALIFLY

on:
  push:
    branches:
      - main
      - "setup/**"
      - "feature/**"
      - "design/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm install
      - name: Install free Piper speech engine
        run: python -m pip install --disable-pip-version-check piper-tts
      - name: Download male Arabic Piper voice model
        run: |
          mkdir -p /tmp/alifly-piper
          curl --fail --location --retry 3 \
            https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx \
            --output /tmp/alifly-piper/ar_JO-kareem-medium.onnx
          curl --fail --location --retry 3 \
            https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json \
            --output /tmp/alifly-piper/ar_JO-kareem-medium.onnx.json
      - name: Generate permanent Arabic letter audio
        run: node scripts/generate-arabic-audio.mjs /tmp/alifly-piper/ar_JO-kareem-medium.onnx
      - name: Run unit tests
        run: npm test
      - name: Build project
        run: npm run build
      - name: Verify GitHub Pages routes and SEO files
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/lessons/index.html
          test -f dist/lessons/alif/index.html
          test "$(find dist/audio/letters -maxdepth 1 -name '*.wav' | wc -l)" -eq 28
          test -s dist/audio/letters/alif.wav
          grep -q "Уроки арабского языка" dist/lessons/index.html
          grep -q "Арабская буква Алиф" dist/lessons/alif/index.html
          grep -q "assets/" dist/lessons/alif/index.html
      - name: Upload generated letter audio for manual review
        uses: actions/upload-artifact@v4
        with:
          name: alifly-male-arabic-letter-audio
          path: public/audio/letters/*.wav
          if-no-files-found: error
          retention-days: 7
