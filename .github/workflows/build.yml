name: Build ALIFLY

on:
  push:
    branches:
      - main
      - "setup/**"
      - "feature/**"
      - "design/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Nabra TTS browser bundle
        run: |
          git clone https://github.com/Oddadmix/nabra-tts.git /tmp/nabra-tts
          git -C /tmp/nabra-tts checkout 16b5281ce61993df3526740990cf845a3f3036f4
          npm --prefix /tmp/nabra-tts ci
          npm --prefix /tmp/nabra-tts run build
          mkdir -p node_modules/nabra-tts/dist
          cp -R /tmp/nabra-tts/dist/. node_modules/nabra-tts/dist/
      - name: Build project
        run: npm run build
