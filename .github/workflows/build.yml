name: Build ALIFLY

on:
  push:
    branches:
      - main
      - "setup/**"
      - "feature/**"
      - "design/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Test Firestore rules in the emulator
        run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore --project demo-alifly-rules "node --test firestore.rules.test.mjs"
      - name: Generate permanent Arabic letter audio
        run: |
          git clone https://github.com/Oddadmix/nabra-tts.git /tmp/nabra-tts
          git -C /tmp/nabra-tts checkout 16b5281ce61993df3526740990cf845a3f3036f4
          npm --prefix /tmp/nabra-tts ci
          npm --prefix /tmp/nabra-tts run build
          node scripts/generate-arabic-audio.mjs /tmp/nabra-tts
      - name: Run unit tests
        run: npm test
      - name: Build project
        run: npm run build
