name: Firestore Rules

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "firestore.rules"
      - "firestore.rules.test.mjs"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firestore.rules.test.mjs"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/firestore-rules.yml"

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Test Firestore rules in the emulator
        run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore --project demo-alifly-rules "node --test firestore.rules.test.mjs"
