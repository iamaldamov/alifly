name: ALIFLY Telegram Worker checks

on:
  push:
    branches:
      - telegram-edition
    paths:
      - "telegram-worker/**"
      - ".github/workflows/telegram-worker-check.yml"
  pull_request:
    paths:
      - "telegram-worker/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
