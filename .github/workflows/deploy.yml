name: Deploy ALIFLY to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Generate permanent Arabic letter audio
        run: |
          git clone https://github.com/Oddadmix/nabra-tts.git /tmp/nabra-tts
          git -C /tmp/nabra-tts checkout 16b5281ce61993df3526740990cf845a3f3036f4
          npm --prefix /tmp/nabra-tts ci
          npm --prefix /tmp/nabra-tts run build
          node scripts/generate-arabic-audio.mjs /tmp/nabra-tts
      - name: Build ALIFLY
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
