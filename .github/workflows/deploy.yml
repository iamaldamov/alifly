name: Deploy ALIFLY to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Install Piper speech engine
        run: python -m pip install --disable-pip-version-check piper-tts
      - name: Download male Arabic Piper voice model
        run: |
          mkdir -p /tmp/alifly-piper
          curl --fail --location --retry 3 \
            https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx \
            --output /tmp/alifly-piper/ar_JO-kareem-medium.onnx
          curl --fail --location --retry 3 \
            https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json \
            --output /tmp/alifly-piper/ar_JO-kareem-medium.onnx.json
      - name: Generate and validate all 28 Arabic letter audio files
        run: |
          node scripts/generate-arabic-audio.mjs /tmp/alifly-piper/ar_JO-kareem-medium.onnx
          test "$(find public/audio/letters -maxdepth 1 -name '*.wav' | wc -l)" -eq 28
          test -s public/audio/letters/alif.wav
      - name: Build ALIFLY
        run: npm run build
      - name: Verify generated audio is included in the site
        run: |
          test "$(find dist/audio/letters -maxdepth 1 -name '*.wav' | wc -l)" -eq 28
          test -s dist/audio/letters/alif.wav
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
